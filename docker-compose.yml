# Postgres credentials below must match DB_NAME/DB_USER/DB_PASSWORD in .env.
# They're hardcoded rather than pulled from .env via ${...} because Compose
# resolves $-sequences when it parses .env for its own interpolation, which
# silently mangles values like SECRET_KEY that contain "$" (e.g. $v7i, $fx
# get read as unset variable references and dropped). `env_file:` below is a
# different mechanism — it hands the file's lines to the container as real
# environment variables with no interpolation of its own, so it doesn't
# have this problem (python-decouple reads the same values either way,
# whether from those variables or, same as always, straight from the
# bind-mounted file itself) — it's here so plain shell scripts in the
# container (docker-entrypoint.sh's own $DEBUG check) can see them too,
# which reading the file through decouple alone never gave them.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spots
      POSTGRES_USER: spots
      POSTGRES_PASSWORD: spots
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spots"]
      interval: 2s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
