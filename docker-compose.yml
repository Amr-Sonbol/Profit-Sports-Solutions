# Postgres credentials below must match DB_NAME/DB_USER/DB_PASSWORD in .env.
# They're hardcoded rather than pulled from .env via ${...} because Compose
# resolves $-sequences when it parses .env for its own interpolation, which
# silently mangles values like SECRET_KEY that contain "$" (e.g. $v7i, $fx
# get read as unset variable references and dropped). `env_file:` below has
# the same interpolation, so any .env value containing "$" must be wrapped
# in single quotes (SECRET_KEY='...'): Compose treats single-quoted values
# literally, and python-decouple strips the quotes when it reads the file
# directly. The container gets the values as real environment variables
# (which decouple prefers over the file) so plain shell scripts in the
# container (docker-entrypoint.sh's own $DEBUG check) can see them too.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: spots
      POSTGRES_USER: spots
      POSTGRES_PASSWORD: spots
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spots"]
      interval: 2s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
