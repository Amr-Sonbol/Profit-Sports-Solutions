name: Tests & Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: spots
          POSTGRES_USER: spots
          POSTGRES_PASSWORD: spots
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spots"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-test-secret-key-not-used-in-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: spots
      DB_USER: spots
      DB_PASSWORD: spots
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # Only an actual push to master redeploys — a PR run stops at the test
    # job above, same as before this was added.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      # render.yaml turns off Render's own deploy-on-push (autoDeployTrigger:
      # off) specifically so this is the only thing that can trigger one —
      # tests have to pass first. The hook URL comes from the service's own
      # Settings tab in the Render dashboard (see render.yaml's own
      # comment for the one-time setup).
      - name: Trigger Render deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
